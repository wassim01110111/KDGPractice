<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACS Practice</title>
    <script>
      try {
        const theme = localStorage.getItem("acs-practice-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="header-tools" id="header-tools">
        <button
          id="brand"
          class="brand"
          type="button"
          aria-label="ACS Practice"
        >
          ACS Practice
          <div id="clickme">Click Me</div>
        </button>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <span aria-hidden="true">☾</span>
        </button>

        <button
          id="focus-toggle"
          class="focus-toggle"
          type="button"
          aria-label="Enable focus mode"
          aria-pressed="false"
          hidden
          title="Hide distractions"
        >
          <span aria-hidden="true">◎</span>
          <span class="focus-label">Hide distractions</span>
        </button>
        <div
          id="wassim-sign"
          class="maker-signature"
          aria-label="Made by Wassim"
        >
          <span>MADE BY</span>
          <div class="maker-name-row">
            <strong data-text="WASSIM">WASSIM</strong>
            <span class="maker-cursor" aria-hidden="true">_</span>
          </div>
        </div>
      </div>
      <nav id="nav">
        <a href="#/reader">Reference</a><a href="#/practice">Practice</a
        ><a href="#/exam">Exam</a><a href="#/progress">Progress</a>
      </nav>
    </header>
    <div
      id="terminal-artifact"
      class="terminal-artifact"
      aria-hidden="true"
    ></div>
    <main id="main"></main>
    <button
      id="back-to-top"
      class="back-to-top"
      type="button"
      aria-label="Back to top"
      title="Back to top"
      hidden
    >
      <span aria-hidden="true">↑</span>
    </button>
    <div
      id="periodic-toast"
      class="periodic-toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <!-- SQL engine: PGlite (PostgreSQL in WASM), loaded via <script src>. Change the URL inside js/pglite-loader.js to self-host. -->
    <script type="module" src="js/pglite-loader.js"></script>
    <script src="js/core.js"></script>
    <script src="js/arrays.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
