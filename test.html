<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout Test</title>

    <style>
      .header-tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-flow: row;
        gap: 10px;
        width: 320px;
        margin-top: 20px;
        align-items: center;
        justify-items: center;
      }

      .item {
        box-sizing: border-box;
        width: 100%;
        padding: 20px;
        background: lightblue;
        text-align: center;
        border: 1px solid black;
      }

      [hidden] {
        display: none !important;
      }

      /* Exactly 3 visible elements */
      .header-tools:has(> :nth-child(3 of :not([hidden]))):not(
          :has(> :nth-child(4 of :not([hidden])))
        ) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      /* Odd number of 5 or more */
      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        ) {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      /* Explicitly place the first three elements */
      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(-n + 3 of :not([hidden])) {
        grid-row: 1;
      }

      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(1 of :not([hidden])) {
        grid-column: 1;
      }

      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(2 of :not([hidden])) {
        grid-column: 2;
      }

      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(3 of :not([hidden])) {
        grid-column: 3;
      }

      /* Remaining elements: two per row */
      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(2n + 4 of :not([hidden])) {
        grid-column: 1;
      }

      .header-tools:has(> :nth-child(5 of :not([hidden]))):has(
          > :nth-child(odd of :not([hidden])):nth-last-child(
              1 of :not([hidden])
            )
        )
        > :nth-child(2n + 5 of :not([hidden])) {
        grid-column: 3;
      }
    </style>
  </head>

  <body>
    <div class="header-tools" id="header-tools">
      <button class="item" id="toggle">Toggle Element 2</button>

      <div class="item">Element 1</div>
      <div class="item" id="second" hidden>Element 2</div>
      <div class="item">Element 3</div>
      <div class="item">Element 4</div>
      <div class="item">Element 5</div>
      <div class="item">Element 6</div>
      <div class="item">Element 7</div>
      <div class="item">Element 8</div>
    </div>

    <script>
      const toggle = document.getElementById("toggle");
      const second = document.getElementById("second");

      toggle.addEventListener("click", () => {
        second.hidden = !second.hidden;
      });
    </script>
  </body>
</html>
